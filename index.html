<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071329">
  <meta name="description" content="眠れない夜に、ひとりじゃない。静かなおやすみコミュニティ。">
  <title>おやすみ — ひとりじゃない、おやすみの時間。</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261003-dark-hint">
  <script src="nickname.js" defer></script>
  <script src="cat-faces.js" defer></script>
  <script src="cat-scenes.js" defer></script>
  <script src="tonight-trend.js" defer></script>
  <script src="sleep-flow.js" defer></script>
  <script src="cat-day-scenes.js" defer></script>
  <script src="vendor/supabase.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-api.js?v=20261003-profile-setup" defer></script>
  <script src="app.js?v=20261003-dark-hint" defer></script>
</head>
<body>
  <div class="night-sky" aria-hidden="true"></div>
  <aside class="desktop-intro"><span class="brand-moon">☾</span><h1>おやすみ</h1><p>ひとりじゃない、<br>おやすみの時間。</p><div class="intro-note">今日もお疲れさま。<br>ここでは、眠れない夜もひとりじゃない。</div></aside>
  <div class="app-shell"><main id="app"></main><nav id="navigation" aria-label="メインナビゲーション"></nav></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="nickname-dialog" aria-labelledby="nickname-title"><form id="nickname-form" novalidate><h2 id="nickname-title">なんて呼びましょう？</h2><label for="nickname">ニックネーム</label><p id="nickname-help">1〜12文字。連絡先や不適切な表現は使えません。</p><input id="nickname" name="nickname" type="text" placeholder="なんて呼べばいい？" required autocomplete="nickname" enterkeyhint="done" aria-describedby="nickname-help nickname-error"><p id="nickname-error" class="nickname-error" role="alert"></p><div class="dialog-actions"><button type="button" class="text-button" id="cancel-name">キャンセル</button><button class="cream-button" type="submit">保存する</button></div></form></dialog>
  <dialog id="expression-dialog" aria-labelledby="expression-title"><h2 id="expression-title">猫の表情</h2><p id="expression-description">今の気分に合う表情を、ひとつ。</p><div id="expression-options" class="expression-options" role="group" aria-label="猫の表情の選択肢"></div><p id="expression-error" class="nickname-error" role="alert"></p><button type="button" class="text-button" id="cancel-expression">閉じる</button></dialog>
<dialog id="share-dialog" aria-labelledby="share-title"><h2 id="share-title">この場所を教える 🌙</h2><p>URLを長押ししてコピーすることもできます。</p><p id="share-url" class="share-url" tabindex="0"></p><div class="dialog-actions"><button type="button" class="text-button" data-close-share>閉じる</button><button type="button" class="cream-button" data-copy-place>URLをコピー</button></div></dialog>
</body>
</html>
