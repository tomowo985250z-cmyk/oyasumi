<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071329">
  <meta name="description" content="眠れない夜に、ひとりじゃない。静かなおやすみコミュニティ。">
  <title>おやすみ — ひとりじゃない、おやすみの時間。</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="night-sky" aria-hidden="true"></div>
  <aside class="desktop-intro"><span class="brand-moon">☾</span><h1>おやすみ</h1><p>ひとりじゃない、<br>おやすみの時間。</p><div class="intro-note">今日もお疲れさま。<br>ここでは、眠れない夜もひとりじゃない。</div></aside>
  <div class="app-shell"><main id="app"></main><nav id="navigation" aria-label="メインナビゲーション"></nav></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="nickname-dialog"><form id="nickname-form"><h2>なんて呼びましょう？</h2><p>この夜を過ごす、あなたの名前。</p><label for="nickname">ニックネーム</label><input id="nickname" name="nickname" maxlength="16" required autocomplete="nickname"><div class="dialog-actions"><button type="button" class="text-button" id="cancel-name">キャンセル</button><button class="cream-button" type="submit">保存する</button></div></form></dialog>
</body>
</html>
