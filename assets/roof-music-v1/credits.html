<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月の光 — 音楽の出典</title><style>body{max-width:680px;margin:32px auto;padding:0 20px;font:16px/1.8 system-ui}a{overflow-wrap:anywhere}</style><h1>月の光 — 屋根のオルゴール</h1><p>Claude Debussy「Clair de lune」（ベルガマスク組曲、1905）。<a href="https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1778">E. Fromont初版に基づくKeith OHara / Mutopia-1778の譜面</a>を使用。原曲および浄書データは<a href="https://www.mutopiaproject.org/legal.html">パブリックドメイン</a>として公開されています。</p><p>冒頭26小節を静かなオルゴール向けに編曲し、独自の結びを追加。録音・サンプル音源は流用せず、音色・演奏タイミング・残響を独自に合成しました。約125.2秒。循環する余韻でループをつないでいます。</p><p>原譜と取得URL・音源仕様・加工内容は<a href="manifest.json">素材情報</a>に記録。独自の聴感確認は未実施です。</p><a href="../../index.html">おやすみに戻る</a></html>
