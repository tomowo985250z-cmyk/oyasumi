<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月の光 v3・v4 比較試聴</title><style>body{max-width:650px;margin:28px auto;padding:0 18px;font:16px/1.8 system-ui;color:#343b40;background:#faf7ef}audio{width:100%}button{padding:10px 18px;font:inherit}input{max-width:100%}a{color:#465e63}</style><h1>月の光 v3・v4</h1><p>同じ曲・テンポ・平均信号レベルで比較できます。再生ボタンで切り替えると、同じ位置から続けます。</p><label>比較用の音量 <input data-volume type="range" min="0" max="100" step="1" value="35" aria-label="比較音量"></label><p>v3</p><button type="button" data-listen="0">v3を再生</button><audio controls loop preload="none" src="../roof-music-v3/clair-de-lune-box.wav"></audio><p>v4：音ごとの微妙な差・木箱の共鳴</p><button type="button" data-listen="1">v4を再生</button><audio controls loop preload="none" src="clair-de-lune-box.wav"></audio><p data-status aria-live="polite"></p><p>聴感による音色・等音量の確認は未実施です。</p><a href="credits.html">出典・音源情報</a> ／ <a href="../../index.html">おやすみに戻る</a><script>const tracks=[...document.querySelectorAll("audio")];let active;for(const a of tracks){a.volume=.35;a.addEventListener("play",()=>{for(const b of tracks)if(b!==a)b.pause();active=a;});}document.querySelector("[data-volume]").addEventListener("input",e=>{for(const a of tracks)a.volume=Number(e.target.value)/100;});for(const button of document.querySelectorAll("[data-listen]"))button.addEventListener("click",()=>{const a=tracks[Number(button.dataset.listen)],at=active?.currentTime||0;for(const b of tracks)b.pause();const seek=()=>{if(Number.isFinite(a.duration))a.currentTime=Math.min(at,Math.max(0,a.duration-.001));};if(a.readyState>=1)seek();else a.addEventListener("loadedmetadata",seek,{once:true});void a.play().then(()=>{document.querySelector("[data-status]").textContent=button.textContent.replace("を再生","")+"を試聴中";}).catch(()=>{document.querySelector("[data-status]").textContent="再生できません。音源の読み込み後にもう一度タップしてください。";});});</script></html>
