<h1>ジムノペディ第1番</h1>
<p>夜に静かに聴く、ピアノ版の試作です。<br>同じ再生位置から聴き比べられます。</p>
<section class="panel" aria-label="比較試聴">
 <div class="variants" role="group" aria-label="音色">
  <button type="button" data-variant="musicbox" aria-pressed="false">オルゴール</button>
  <button type="button" data-variant="piano" aria-pressed="true">ピアノ（試作）</button>
 </div>
 <button type="button" id="play" disabled>再生</button>
 <label for="seek">再生位置 <output id="time">0:00 / 2:19</output></label>
 <input id="seek" type="range" min="0" max="139.00825" step="0.1" value="0" aria-label="再生位置">
 <label for="volume">試聴音量 <output id="level">25%</output></label>
 <input id="volume" type="range" min="0" max="100" step="1" value="25" aria-label="試聴音量">
 <p id="status" role="status" aria-live="polite">準備しています。</p>
</section>
<p class="note">試聴音量はこのページだけに保存されます。既存のオルゴール5曲はそのまま再生できます。</p>
