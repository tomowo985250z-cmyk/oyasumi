<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1420">
  <title>3社統合モニター</title>
  <link rel="stylesheet" href="./style.css?v=3">
  <script type="module" src="./app.mjs?v=4"></script>
</head>
<body>
  <div id="app">
    <nav class="tabs" role="tablist" aria-label="会社の切替">
      <button id="tab-canbas" role="tab" aria-controls="screen-canbas" aria-selected="true" data-screen="canbas">キャンバス</button>
      <button id="tab-kringle" role="tab" aria-controls="screen-kringle" aria-selected="false" tabindex="-1" data-screen="kringle">クリングル</button>
      <button id="tab-joby" role="tab" aria-controls="screen-joby" aria-selected="false" tabindex="-1" data-screen="joby">Joby</button>
    </nav>
    <main id="screens">
      <section id="screen-canbas" class="screen" role="tabpanel" aria-labelledby="tab-canbas"><iframe title="CanBas 治験・イベントモニター" data-company="canbas"></iframe></section>
      <section id="screen-kringle" class="screen" role="tabpanel" aria-labelledby="tab-kringle" hidden><iframe title="クリングルファーマ 開発・イベントモニター" data-company="kringle"></iframe></section>
      <section id="screen-joby" class="screen" role="tabpanel" aria-labelledby="tab-joby" hidden><iframe title="Joby 認証・イベントモニター" data-company="joby"></iframe></section>
    </main>
  </div>
  <noscript>表示にはJavaScriptが必要です。<a href="../canbas/">キャンバス</a>・<a href="../kringle/">クリングル</a>・<a href="../joby/">Joby</a></noscript>
</body>
</html>
