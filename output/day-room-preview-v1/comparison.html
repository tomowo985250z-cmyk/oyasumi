<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>昼のおへや · 完成イメージ</title><style>
@font-face{font-family:Oyasumi;src:url('/assets/fonts/mplus-rounded-400-6208cb6654e52a9d.woff2')}*{box-sizing:border-box}body{background:#0c1930;color:#efedf4;font-family:Oyasumi,system-ui,sans-serif;margin:0;padding:44px;line-height:1.8}header{display:flex;align-items:baseline;justify-content:space-between;gap:30px;max-width:1140px;margin:auto auto 36px}header p{font-size:11px;color:#9fadc4;letter-spacing:.08em}h1{font-size:28px;font-weight:400;letter-spacing:.08em;margin:0}a{font-size:11px;color:#c6bfd8}main{max-width:1140px;margin:auto}h2{font-weight:400;font-size:16px;margin:30px 0 18px}.scene-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}figure{margin:0;min-width:0}figure img{width:100%;display:block;border-radius:20px}figcaption{font-size:12px;color:#c9c3d7;margin:12px 0 0}.scene-grid figure p{font-size:10px;color:#8fa2bf;margin:4px 0 0}.species-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.species-grid figure{background:#15233d;border-radius:18px;overflow:hidden}.species-grid img{border-radius:0}.species-grid figcaption{padding:0 15px 13px}.rules{padding:22px 26px;border:1px solid #8fa2bf25;border-radius:18px;display:flex;justify-content:space-between;gap:20px;margin:32px 0}.rules p{font-size:11px;color:#9fadc4;margin:0}.rules strong{display:block;font-size:14px;color:#e1dae7;font-weight:400;margin-bottom:5px}.foot{font-size:10px;color:#8499b6;margin:30px 0 0}@media(max-width:700px){body{padding:24px 18px}header{display:block}.scene-grid,.species-grid{grid-template-columns:repeat(2,1fr)}.rules{flex-direction:column}h1{font-size:23px}}
</style></head><body><header><div><p>OYASUMI / DAY ROOM STUDY</p><h1>好きな場所で、好きな時間を。</h1></div><a href="/">操作できるプレビューへ ↗</a></header><main>
<div class="scene-grid"><figure><img src="room-window-390.png" alt="窓辺にいる三毛猫"><figcaption>窓辺</figcaption><p>やわらかな光のそばで。</p></figure><figure><img src="room-cushion-390.png" alt="クッションでうとうとする三毛猫"><figcaption>クッション</figcaption><p>いつもの場所で、ひとやすみ。</p></figure><figure><img src="room-corner-390.png" alt="部屋の隅にいる三毛猫"><figcaption>部屋の隅</figcaption><p>今日は、ここが落ち着くみたい。</p></figure><figure><img src="room-away-390.png" alt="猫が留守の静かな部屋"><figcaption>たまには、留守の時間も</figcaption><p>しばらくしたら、自然に帰ってきます。</p></figure></div>
<div class="rules"><p><strong>居場所 · 30〜90分ごと</strong>気分・仕草は10〜30分ごと。</p><p><strong>留守 · 1日0〜2回</strong>5〜15分で、そっと帰宅。</p><p><strong>日付と時刻で、同じ状態に</strong>再読み込みでも予定は変わりません。</p></div>
<h2>16種の猫が、それぞれの部屋で。</h2><div class="species-grid" id="species"></div><p class="foot">既存の猫画像をそのまま使用したローカル試作。画像の描き直し・本番DB変更・commit・pushは行っていません。</p>
</main><script>fetch('coats.json').then(r=>r.json()).then(coats=>{for(const c of coats){const f=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src='cat-'+c.id+'.png';img.alt=c.label;caption.textContent=c.label;f.append(img,caption);document.querySelector('#species').append(f)}})</script></body></html>
