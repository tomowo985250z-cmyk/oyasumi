<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫のごはん・おやつ ローカル確認</title><style>body{font-family:system-ui;background:#f6f0e8;color:#514438;margin:24px}iframe{height:850px;border:1px solid #ddd;border-radius:24px;max-width:100%}select,button{padding:10px;margin:5px}p{max-width:700px}</style><h1>猫のごはん・おやつ</h1><p>ローカル専用。本番DBには接続しません。検証用アカウントには今日のおやすみ投稿を用意しています。おやつは贈る側が日本時間で1日合計1回です。</p><select id="coat"></select><select id="kind"><option value="meal">自分のごはん</option><option value="treat">他の猫へおやつ</option></select><select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select><button id="reset">検証用の記録をリセット</button><p><a href="screen.html?user=receiver">受け取る側の記録を開く</a></p><iframe id="screen" title="アプリ実画面"></iframe><script src="/cat-faces.js"></script><script>for(const c of CatFaces.coats)coat.add(new Option(c.label||c.id,c.id));coat.value='calico';const previewFrame=document.getElementById("screen");function update(){previewFrame.style.width=width.value+'px';previewFrame.src='screen.html?coat='+coat.value+'&kind='+kind.value}for(const e of [coat,kind,width])e.onchange=update;reset.onclick=async()=>{await fetch('/__care/reset',{method:'POST'});update()};update();</script></html>
